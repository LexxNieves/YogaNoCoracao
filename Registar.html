<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - Yoga na Linha do Coração</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #eab308;
            --primary-dark: #ca8a04;
            --accent: #f59e0b;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fefefe;
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.95) 0%, rgba(202, 138, 4, 0.95) 100%);
        }
        
        .amber-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .gradient-border {
            position: relative;
            background: white;
            border-radius: 1rem;
        }
        
        .gradient-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--primary-dark), var(--accent), var(--primary));
            border-radius: 1.1rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .gradient-border:hover::before {
            opacity: 1;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-amber-50 to-white">
    <!-- Hotbar/Navbar (igual às outras páginas) -->
    <nav class="gold-gradient shadow-2xl sticky top-0 z-50 py-2">
        <div class="container mx-auto px-4">
            <div class="flex flex-col items-center space-y-3">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="text-white text-lg font-bold tracking-wider">
                        YOGA NA LINHA DO CORAÇÃO
                    </div>
                </div>

                <!-- Menu Desktop -->
                <div class="hidden lg:flex space-x-1">
                    <a href="index.html" class="nav-link text-white text-sm font-medium px-3 py-1 rounded-lg hover:bg-amber-600/30 transition">Inicio</a>
                    <!-- Outros itens do menu... -->
                    <a href="#" id="login-btn" class="nav-link text-white text-sm font-medium px-3 py-1 rounded-lg hover:bg-amber-600/30 transition flex items-center">
                        <i class="fas fa-user-circle mr-1 text-xs"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <section class="py-16 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md mx-auto">
            <div class="gradient-border p-8 shadow-lg">
                <!-- Cabeçalho -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Criar Conta</h1>
                    <p class="text-gray-600">Junte-se à nossa comunidade de yoga</p>
                </div>

                <!-- Mensagem de Status -->
                <div id="register-message" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

                <!-- Formulário de Registo -->
                <form id="register-form" class="space-y-4">
                    <!-- Nome Completo -->
                    <div>
                        <label for="fullname" class="block text-gray-700 text-sm font-medium mb-2">Nome Completo *</label>
                        <input type="text" id="fullname" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
                            placeholder="Seu nome completo">
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email *</label>
                        <input type="email" id="email" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
                            placeholder="seu@email.com">
                    </div>

                    <!-- Telefone -->
                    <div>
                        <label for="phone" class="block text-gray-700 text-sm font-medium mb-2">Telefone</label>
                        <input type="tel" id="phone" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
                            placeholder="+351 123 456 789">
                    </div>

                    <!-- Data de Nascimento -->
                    <div>
                        <label for="birthdate" class="block text-gray-700 text-sm font-medium mb-2">Data de Nascimento</label>
                        <input type="date" id="birthdate" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
                    </div>

                    <!-- Senha -->
                    <div>
                        <label for="password" class="block text-gray-700 text-sm font-medium mb-2">Senha *</label>
                        <input type="password" id="password" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
                            placeholder="Mínimo 8 caracteres">
                    </div>

                    <!-- Confirmar Senha -->
                    <div>
                        <label for="confirm-password" class="block text-gray-700 text-sm font-medium mb-2">Confirmar Senha *</label>
                        <input type="password" id="confirm-password" required 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
                            placeholder="Repita a sua senha">
                    </div>

                    <!-- Termos e Condições -->
                    <div class="flex items-start space-x-2">
                        <input type="checkbox" id="terms" required 
                            class="mt-1 rounded border-gray-300 text-amber-600 focus:ring-amber-500">
                        <label for="terms" class="text-sm text-gray-600">
                            Concordo com os <a href="#" class="text-amber-600 hover:text-amber-700">Termos e Condições</a> 
                            e <a href="#" class="text-amber-600 hover:text-amber-700">Política de Privacidade</a>
                        </label>
                    </div>

                    <!-- Newsletter -->
                    <div class="flex items-start space-x-2">
                        <input type="checkbox" id="newsletter" 
                            class="mt-1 rounded border-gray-300 text-amber-600 focus:ring-amber-500">
                        <label for="newsletter" class="text-sm text-gray-600">
                            Desejo receber newsletters e informações sobre aulas e eventos
                        </label>
                    </div>

                    <!-- Botão de Submissão -->
                    <button type="submit" id="register-submit"
                            class="w-full amber-gradient text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all duration-300 transform hover:scale-[1.02] mt-4 flex items-center justify-center">
                        <span id="register-text">Criar Conta</span>
                        <div id="register-spinner" class="hidden ml-2">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </form>

                <!-- Link para Login -->
                <div class="mt-6 text-center">
                    <p class="text-gray-600 text-sm">
                        Já tem uma conta? 
                        <a href="index.html" class="text-amber-600 hover:text-amber-700 font-medium transition">Faça login aqui</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (igual às outras páginas) -->
    <footer class="bg-white/90 backdrop-blur-sm py-8 mt-auto border-t border-amber-200/50">
        <div class="container mx-auto px-4">
            <div class="flex justify-center space-x-8">
                <!-- Ícones sociais... -->
            </div>
        </div>
    </footer>

    <script>
       // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA3zbLeOz_y59NYLu5AbIN3xMZ6-3NTOYQ",
            authDomain: "yoganocoracao-ddf1d.firebaseapp.com",
            projectId: "yoganocoracao-ddf1d",
            storageBucket: "yoganocoracao-ddf1d.firebasestorage.app",
            messagingSenderId: "1011537032289",
            appId: "1:1011537032289:web:4f394986de1f2991ea2620",
            measurementId: "G-LGS8SC9KKS"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Configurações do Firestore para produção
        db.settings({
            cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
        });

        // Elementos do DOM
        const registerForm = document.getElementById('register-form');
        const registerMessage = document.getElementById('register-message');
        const registerSubmit = document.getElementById('register-submit');
        const registerText = document.getElementById('register-text');
        const registerSpinner = document.getElementById('register-spinner');

        // Função para mostrar mensagens
        function showMessage(message, type = 'error') {
            registerMessage.classList.remove('hidden');
            registerMessage.textContent = message;
            registerMessage.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-green-100 text-green-700 border border-green-200'}`;
        }

        // Função para mostrar loading
        function setLoading(isLoading) {
            if (isLoading) {
                registerSubmit.disabled = true;
                registerText.classList.add('hidden');
                registerSpinner.classList.remove('hidden');
            } else {
                registerSubmit.disabled = false;
                registerText.classList.remove('hidden');
                registerSpinner.classList.add('hidden');
            }
        }

        // Função para criar usuário no Firestore usando Firebase Functions como fallback
        async function createUserInFirestore(userId, userData) {
            try {
                console.log('Tentando criar usuário no Firestore:', userId);
                
                await db.collection('users').doc(userId).set({
                    fullName: userData.fullName,
                    email: userData.email,
                    phone: userData.phone || '',
                    birthdate: userData.birthdate || '',
                    newsletter: userData.newsletter || false,
                    role: 'normal',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    emailVerified: false
                });
                
                console.log('Usuário criado com sucesso no Firestore');
                return { success: true };
                
            } catch (error) {
                console.error('Erro ao criar usuário no Firestore:', error);
                
                // Se for erro de permissão, tentar método alternativo
                if (error.code === 'permission-denied') {
                    return {
                        success: false,
                        error: 'PERMISSION_DENIED',
                        message: 'Permissão negada pelo Firestore'
                    };
                }
                
                return {
                    success: false,
                    error: error.code,
                    message: error.message
                };
            }
        }

        // Função alternativa usando callable function (se implementada)
        async function createUserViaCloudFunction(userId, userData) {
            // Esta função requer que você crie uma Cloud Function
            // Retorna null se não estiver implementada
            return null;
        }

        // Submit do formulário de registo
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const birthdate = document.getElementById('birthdate').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;
            const newsletter = document.getElementById('newsletter').checked;
            
            // Validações básicas
            if (!terms) {
                showMessage('Deve aceitar os Termos e Condições para continuar.');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('As senhas não coincidem!');
                return;
            }
            
            if (password.length < 8) {
                showMessage('A senha deve ter pelo menos 8 caracteres!');
                return;
            }
            
            setLoading(true);
            registerMessage.classList.add('hidden');
            
            try {
                console.log('Iniciando processo de registro...');
                
                // Criar usuário no Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                console.log('Usuário criado no Auth:', user.uid);
                
                // Preparar dados do usuário
                const userData = {
                    fullName: fullName,
                    email: email,
                    phone: phone,
                    birthdate: birthdate,
                    newsletter: newsletter
                };
                
                // Criar usuário no Firestore
                const firestoreResult = await createUserInFirestore(user.uid, userData);
                
                if (firestoreResult.success) {
                    console.log('Tentando enviar email de verificação...');
                    
                    // Enviar email de verificação
                    await user.sendEmailVerification();
                    
                    showMessage('Conta criada com sucesso! Verifique o seu email para confirmar a conta.', 'success');
                    
                    // Fazer logout automático após registro bem-sucedido
                    setTimeout(() => {
                        auth.signOut().then(() => {
                            window.location.href = 'index.html';
                        });
                    }, 3000);
                    
                } else {
                    // Se falhar no Firestore, tentar método alternativo
                    if (firestoreResult.error === 'PERMISSION_DENIED') {
                        console.log('Tentando método alternativo...');
                        const cloudFunctionResult = await createUserViaCloudFunction(user.uid, userData);
                        
                        if (!cloudFunctionResult) {
                            // Se nenhum método funcionar, deletar usuário do Auth
                            await user.delete();
                            showMessage('Erro de configuração do sistema. Por favor, contacte o administrador.');
                            return;
                        }
                    } else {
                        await user.delete();
                        showMessage('Erro ao salvar dados do usuário: ' + firestoreResult.message);
                    }
                }
                
            } catch (error) {
                console.error('Erro completo no registro:', error);
                
                let errorMessage = 'Erro ao criar conta. Tente novamente.';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'Este email já está em uso.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Email inválido.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Operação não permitida.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Senha muito fraca. Use pelo menos 8 caracteres.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Erro de rede. Verifique sua conexão.';
                        break;
                    case 'permission-denied':
                        errorMessage = 'Permissão negada. Contacte o administrador.';
                        break;
                }
                
                showMessage(errorMessage);
            } finally {
                setLoading(false);
            }
        });

        // Funcionalidade do botão de login
        document.getElementById('login-btn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
