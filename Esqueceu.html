    <!-- Recuperação de Senha Section -->

                <!-- Formulário de Recuperação -->
                <div class="space-y-6">
                    <!-- Mensagem de Status -->
                    <div id="message" class="hidden p-4 rounded-lg text-sm"></div>
                    
                    <form id="forgot-password-form" class="space-y-6">
                        <div>
                            <label for="email" class="block text-gray-700 text-sm font-medium mb-2">Email</label>
                            <input type="email" id="email" required 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"

                        </div>
                        
                        <button type="submit" id="submit-btn" 
                                class="w-full amber-gradient text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all duration-300 transform hover:scale-[1.02] flex items-center justify-center">
                            <span id="submit-text">Enviar Email de Recuperação</span>

                        </button>
                    </form>
                    
                    <!-- Links de Navegação -->
                    <div class="text-center space-y-4">

    <!-- Firebase Configuration -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA3zbLeOz_y59NYLu5AbIN3xMZ6-3NTOYQ",
            authDomain: "yoganocoracao-ddf1d.firebaseapp.com",
            projectId: "yoganocoracao-ddf1d",
            storageBucket: "yoganocoracao-ddf1d.firebasestorage.app",
            messagingSenderId: "1011537032289",
            appId: "1:1011537032289:web:4f394986de1f2991ea2620",
            measurementId: "G-LGS8SC9KKS"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
    </script>

    <script>
        // Elementos do DOM
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');
        const submitText = document.getElementById('submit-text');
        const submitSpinner = document.getElementById('submit-spinner');
        const backToLogin = document.getElementById('back-to-login');

        // Função para mostrar mensagens
        function showMessage(messageText, type = 'error') {
            message.classList.remove('hidden');
            message.textContent = messageText;
            message.className = `p-4 rounded-lg text-sm ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-green-100 text-green-700 border border-green-200'}`;
        }

        // Função para mostrar loading
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitText.classList.add('hidden');
                submitSpinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                submitSpinner.classList.add('hidden');
            }
        }

        // Submit do formulário
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            if (!email) {
                showMessage('Por favor, insira o seu email.');
                return;
            }
            
            setLoading(true);
            message.classList.add('hidden');
            
            try {
                // Enviar email de redefinição de senha
                await auth.sendPasswordResetEmail(email);
                
                showMessage('Email de recuperação enviado com sucesso! Verifique a sua caixa de entrada.', 'success');
                
                // Limpar formulário
                forgotPasswordForm.reset();
                
            } catch (error) {
                console.error('Erro ao enviar email de recuperação:', error);
                
                let errorMessage = 'Erro ao enviar email de recuperação. Tente novamente.';
                
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'Email inválido.';
                        break;
                    case 'auth/user-not-found':
                        errorMessage = 'Nenhuma conta encontrada com este email.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Muitas tentativas. Tente novamente mais tarde.';
                        break;
                }
                
                showMessage(errorMessage);
            } finally {
                setLoading(false);
            }
        });

        // Voltar ao login
        backToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            // Em uma implementação real, você redirecionaria para a página de login
            // ou abriria o modal de login
            
            window.location.href = 'index.html'; // ou abrir modal de login
        });

        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // Language selector
        document.addEventListener('DOMContentLoaded', function() {
            const languageFlags = document.querySelectorAll('.language-flag');
            
            languageFlags.forEach(flag => {
                flag.addEventListener('click', function() {
                    // Remove active class from all flags
                    languageFlags.forEach(f => f.classList.remove('active'));
                    // Add active class to clicked flag
                    this.classList.add('active');
                    // In a real implementation, you would change the language here
                    alert('Idioma alterado para: ' + this.getAttribute('alt'));
                });
            });
            
            // Close mobile menu when clicking outside
            document.addEventListener('click', function(event) {
                const mobileMenu = document.getElementById('mobile-menu');
                const mobileMenuButton = document.getElementById('mobile-menu-button');
                
                if (mobileMenu && mobileMenuButton && 
                    !mobileMenu.contains(event.target) && !mobileMenuButton.contains(event.target)) {
                    mobileMenu.classList.add('hidden');
                }
            });
        });
    </script>
</body>
